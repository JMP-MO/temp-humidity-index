[project]
name = "temp-humidity-index"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cartopy>=0.25.0",
    "cfgrib>=0.9.15.1",
    "eccodeslib>=2.47.3.22",
    "ecmwf-opendata",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "metpy>=1.7.1",
    "netcdf4>=1.7.4",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "xarray>=2026.4.0",
]

[project.scripts]
get-open-data = "temp_humidity_index.retrieve.get_open_data:main"
calc-wet-bulb-temp = "temp_humidity_index.calculate.calc_wet_bulb_temp:main"
calc-thi = "temp_humidity_index.calculate.calc_thi:main"
plot-heat-risk-charts = "temp_humidity_index.plotting.plot_heat_risk_charts:main"
plot-variable-charts = "temp_humidity_index.plotting.plot_variable_charts:main"
build-website = "temp_humidity_index.web.build_website:main"
run-thi = "temp_humidity_index.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/temp_humidity_index"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
