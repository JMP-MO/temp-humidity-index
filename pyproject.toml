[project]
name = "temp-humidity-index"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ecmwf-opendata",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "metpy>=1.7.1",
    "pyyaml>=6.0.3",
    "xarray>=2026.4.0",
]

[project.scripts]
get-open-data = "temp_humidity_index.get_open_data:main"
thi = "temp_humidity_index.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/temp_humidity_index"]
